<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Textos expositivos: 2.º 2.ª · Producción agroindustrial</title><style>:root{--bg:#eef3ec;--fg:#16251c;--mut:#52665a;--line:#c5d4c8;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a14;--fg:#e6efe8;--mut:#a3b8aa;--line:#2f4538;--card:#172a1f}}
:root[data-theme="dark"]{--bg:#0f1a14;--fg:#e6efe8;--mut:#a3b8aa;--line:#2f4538;--card:#172a1f}
*{box-sizing:border-box}body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:18px/1.65 system-ui,-apple-system,'Segoe UI',Arial,sans-serif;}
h1,h2,h3{font-family:system-ui,-apple-system,'Segoe UI',Arial,sans-serif;line-height:1.2}
.wrap{max-width:42rem;margin:0 auto;padding:16px 18px 28px}
.bar{height:8px;background:var(--c);border-radius:99px;margin:6px 0 14px}
.em{font-size:2.2rem}h1{font-size:1.9rem;margin:.2em 0}h2{font-size:1.7rem;margin:.2em 0}h3{font-size:1.2rem;margin:1.2em 0 .3em;color:var(--c)}
.sub{color:var(--mut);margin:.2em 0 1em;font-size:1.05rem}.au{margin-top:1.4em;padding-top:.8em;border-top:1px solid var(--line);color:var(--mut);font-size:.95rem}
p{margin:.7em 0}a.btn,button{font:inherit;background:var(--c);color:#fff;border:0;border-radius:99px;padding:.6em 1.2em;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.35}button.g{background:transparent;color:var(--fg);border:2px solid var(--line)}
.foot{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:26px}.foot span{color:var(--mut);font-size:.9rem}
.pills{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.pills button{white-space:nowrap;background:transparent;color:var(--fg);border:2px solid var(--line);padding:.3em .9em;font-size:.95rem}.pills button.on{background:var(--c);color:#fff;border-color:var(--c)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-top:10px}
.jar{all:unset;cursor:pointer;display:block;text-align:center;background:var(--card);border:3px solid var(--c);border-radius:12px 12px 22px 22px;padding:30px 10px 14px;position:relative;color:var(--fg)}
.jar:before{content:"";position:absolute;left:18%;right:18%;top:-3px;height:14px;background:var(--c);border-radius:0 0 8px 8px}
.jar b{display:block;font-size:1.05rem}.jar small{color:var(--mut);display:block;line-height:1.3;margin-top:4px}.jar .em{display:block}
.chip{display:inline-block;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:.15em .8em;margin:2px 4px 2px 0;font-size:.9rem}</style></head><body><div id="app"></div><script>var D=[{"ty": "intro", "k": "Inicio", "e": "🌾", "c": "#1f4e79", "t": "Producción agroindustrial: la contamos desde Lengua", "s": "2.º 2.ª · Escuela 4-182 Aida Font · Desaguadero, La Paz", "p": ["El curso trabaja en la producción agroindustrial: elabora dulces, mermeladas y escabeche de berenjena, y conoce la producción caprina de la escuela.", "Desde Lengua aportamos los textos expositivos: 16 estudiantes escribieron 5 textos para explicar estos productos y dar a conocer sus beneficios y su elaboración.", "Con esos textos armamos spots publicitarios para la radio escolar. Al final del recorrido encontrás el enlace para escucharlos."]}, {"ty": "txt", "k": "Berenjena", "e": "🍆", "c": "#6b3fa0", "t": "Beneficios nutritivos de la berenjena", "s": "Nutrientes de la berenjena", "a": "Guadalupe Reyes, Benjamín Camargo y Emilia Maturano", "p": ["Una de las elaboraciones importantes de la escuela Nº 4-182 “Aida Font”, de la que somos estudiantes, es el escabeche de berenjena. Por eso, el presente artículo rescata las bondades de este importante vegetal que aporta diferentes nutrientes para el ser humano.", "La berenjena se caracteriza por tener un color morado y por contener una gran cantidad de agua, lo que ayuda a mantenerse hidratado. Se incorpora fácilmente a una alimentación variada y saludable, ya que contiene vitaminas, minerales y antioxidantes. La fibra es un nutriente que ayuda al buen funcionamiento del sistema digestivo.", "Profundizando lo anticipado en el párrafo anterior, esta hortaliza aporta vitaminas como la vitamina C y la vitamina K, y minerales como el potasio. Estos nutrientes cumplen diferentes funciones en el organismo. Por ejemplo, la vitamina C ayuda al funcionamiento del sistema inmunológico y el potasio participa en el funcionamiento de los músculos.", "Por otra parte, la berenjena contiene antioxidantes, especialmente en su piel. Estos compuestos ayudan a proteger las células del organismo y contribuyen a darle su característico color morado.", "En conclusión, la berenjena representa un alimento nutritivo porque aporta agua, vitaminas, minerales y antioxidantes. Su consumo contribuye a mantener una alimentación variada y equilibrada."]}, {"ty": "txt", "k": "Escabeche", "e": "🫙", "c": "#4f46a5", "t": "La berenjena: un alimento nutritivo", "s": "Características, nutrientes y su preparación en escabeche", "a": "Oriana Ramírez y Uriel Rivero", "p": ["La berenjena, cuyo nombre científico es <i>Solanum melongena</i>, es una hortaliza muy utilizada en la alimentación por su variedad de usos y por los nutrientes que aporta. Se caracteriza por su forma alargada o redondeada, su piel generalmente morada y brillante y su pulpa clara y suave. Además de ser un alimento que puede prepararse de distintas maneras, la berenjena contiene una gran cantidad de agua y aporta fibra, vitaminas y minerales, entre ellos potasio y algunas vitaminas del grupo B. También posee compuestos antioxidantes, especialmente en su piel. Por estas características, puede formar parte de una alimentación variada y equilibrada.", "Este vegetal se destaca principalmente por su alto contenido de agua y por aportar fibra, un nutriente que contribuye al buen funcionamiento del sistema digestivo. Por otra parte, su piel posee antioxidantes, sustancias que ayudan a proteger las células del organismo.", "Gracias a su variedad de usos, la berenjena puede incorporarse en numerosas preparaciones. Por ejemplo, puede consumirse al horno, asada, rellena o en escabeche. En el caso de nuestra escuela se elabora escabeche de berenjena, una preparación en la que se utiliza este vegetal como ingrediente principal. De esta manera, además de aprender una forma de preparar y conservar un alimento, se conocen mejor sus características para aprovecharlo en distintas comidas.", "En otras palabras, esta hortaliza no solamente se destaca por las diferentes formas en las que puede cocinarse, sino también por los nutrientes que aporta y por la facilidad con la que puede incorporarse a una alimentación variada.", "En conclusión, la berenjena es un alimento que puede formar parte de una dieta variada y equilibrada. Además, puede prepararse de muchas maneras, como en el escabeche de berenjena, lo que facilita su incorporación en diferentes comidas."]}, {"ty": "txt", "k": "Mermelada", "e": "🍓", "c": "#c0392b", "t": "La elaboración artesanal de mermelada", "s": "", "a": "Aarón Gallo, Santino Ortubia, Martín Nievas y Ariel Ledesma", "p": ["Las mermeladas elaboradas con distintas frutas son producciones características de las prácticas que se llevan a cabo en la escuela “Aida Font”, a tal punto que la venta de estos productos se destaca cada vez que se organiza alguna venta callejera.", "La mermelada puede definirse como una preparación obtenida mediante la cocción de frutas, azúcar y, en algunos casos, jugos de limón, hasta alcanzar una textura adecuada. Por ejemplo, pueden elaborarse mermeladas artesanales de durazno, frutilla, ciruela, manzana o membrillo. Su producción permite conservar las frutas durante más tiempo y obtener un producto de sabor agradable. Además, representa una alternativa para aprovechar la producción de pequeños agricultores y emprendimientos familiares.", "## Elaboración y características", "El proceso comienza con la selección de frutas maduras y en buen estado, que luego de seleccionadas, se lavan bien y se cortan en trozos pequeños para facilitar su cocción. Luego se colocan en una olla junto con el azúcar, donde se cocinan a temperatura moderada.", "Durante este proceso se realiza una mezcla constante para evitar que el producto se adhiera al recipiente. La cocción permite que el agua de la fruta se reduzca y que la preparación adquiera una consistencia espesa.", "## Conservación", "Una vez terminada la cocción, la mermelada se coloca en frascos previamente higienizados y se cierra correctamente. De esta manera, se evita la contaminación y se favorece su conservación.", "En conclusión, la elaboración artesanal de mermelada es un procedimiento sencillo que permite transformar y conservar frutas. Por lo tanto, constituye una práctica utilizada para aprovechar materias primas, elaborar alimentos y desarrollar pequeños emprendimientos productivos."]}, {"ty": "txt", "k": "Dulce de leche", "e": "🥛", "c": "#9a5b2c", "t": "Elaboración artesanal del dulce de leche", "s": "El proceso de producción de un dulce muy consumido por los argentinos", "a": "Guadalupe Aguilera, Cielo Rosales y Alejandra Nievas", "p": ["El dulce de leche es un producto lácteo de los más tradicionales que se elaboran en la escuela Aida Font, ubicada en Desaguadero, La Paz. Esta es una preparación que se realiza principalmente con leche y azúcar. Es muy consumido en Argentina y se utiliza para acompañar alimentos como tostadas, galletas, tortas y postres.", "La forma en que acompaña a cada uno de estos productos puede variar, así, por ejemplo, el dulce de leche se transforma en un elemento untable, ingrediente en bebidas o masas (para saborizar el café, el chocolate caliente o integrarse en masas de brownies y tartas), relleno de pastelería o acompañamiento de postres.", "Para comenzar su elaboración, se coloca la leche en una olla grande y se agrega azúcar. También puede incorporarse una pequeña cantidad de bicarbonato de sodio, que ayuda a mantener el color y la textura del producto. Luego la mezcla se lleva a fuego lento y se revuelve constantemente para evitar que se pegue en el fondo de la olla.", "Durante la cocción, el agua de la leche se va evaporando y el azúcar comienza a concentrarse. Por este motivo, la preparación se vuelve cada vez más espesa y adquiere su característico color marrón. Este proceso requiere tiempo y atención para conseguir la consistencia adecuada.", "Una vez que el dulce alcanza la textura deseada, se retira del fuego y se deja enfriar. Después se coloca en recipientes limpios y se almacena correctamente.", "En definitiva, si bien la elaboración artesanal del dulce de leche requiere pocos ingredientes, es importante respetar los tiempos de cocción y mantener una buena higiene durante todo el proceso. De esta manera, se obtiene un producto de sabor dulce, textura cremosa y características propias de una preparación casera."]}, {"ty": "txt", "k": "Caprina", "e": "🐐", "c": "#3f7d4f", "t": "La producción caprina", "s": "", "a": "Sandra Alonso, Dalixa Ordoñez, Araceli Jofre y Maya Navarro", "p": ["Dentro de las tantas posibilidades que conforman la producción animal, en nuestra escuela se trabaja con la producción caprina, que se refiere a la crianza de cabras para obtener alimentos y otros productos. En la región mendocina esta actividad es importante para numerosas familias rurales, especialmente en zonas áridas donde las condiciones climáticas dificultan otros tipos de producción. Este es el principal hecho que transforma a esta producción en una de las actividades más viables y llevadas a cabo en el departamento de La Paz.", "## ¿Por qué la producción caprina es especialmente elegida en zonas áridas?", "Las cabras son animales que se adaptan a ambientes secos y pueden alimentarse de distintas especies vegetales; por esta razón, la cría de estos animales presenta una alternativa para los productores de la región. La producción caprina permite obtener carne, leche y sus derivados como el queso.", "El proceso de crianza requiere varios cuidados como la alimentación adecuada, el acceso al agua, el control sanitario y la protección de los animales, lo que garantiza su bienestar en todas las etapas de la vida y producción.", "En conclusión, la producción caprina constituye una actividad agropecuaria que contribuye a la economía de las familias rurales de Mendoza; por lo tanto, su desarrollo responsable permite aprovechar los recursos naturales de la región, generar alimentos y conservar una tradición productiva."]}, {"ty": "spots", "k": "Spots", "e": "🎧", "c": "#c27c0e", "t": "Spots publicitarios", "s": "Los textos, convertidos en publicidades para la radio escolar", "p": ["Con la información de estos textos armamos publicidades para dar a conocer los productos. Podés escucharlas en el siguiente enlace."]}],SP="https://drive.google.com/drive/folders/1hLWNNJjARqt0Bfd4ybnKfTmTlx0I8Mgp?usp=sharing",M="B",i=0,sp=false,$=function(s){return document.querySelector(s)};
function body(p){var h='<div class="bar"></div><div class="em">'+p.e+'</div>';
if(p.ty=="intro"){h+='<h1>'+p.t+'</h1><p class="sub">'+p.s+'</p>'+p.p.map(function(x){return'<p>'+x+'</p>'}).join('')+'<p><span class="chip">5 textos expositivos</span><span class="chip">16 estudiantes</span><span class="chip">spots para la radio</span></p>';
if(M=="B")h+='<h3>Elegí un frasco y leé</h3><div class="grid">'+D.slice(1).map(function(q,n){return'<button class="jar" style="--c:'+q.c+'" data-g="'+(n+1)+'"><span class="em">'+q.e+'</span><b>'+(q.ty=="spots"?"Spots":q.k)+'</b><small>'+(q.a?q.a.split(" y ").length>1||q.a.indexOf(",")>0?"":q.a:"escuchalos acá")+'</small></button>'}).join('')+'</div>';
else h+='<p><button data-g="1">Empezar a leer ▶</button></p>';return h}
h+='<h2>'+p.t+'</h2>'+(p.s?'<p class="sub">'+p.s+'</p>':'');
h+=p.p.map(function(x){return x.indexOf("## ")==0?'<h3>'+x.slice(3)+'</h3>':'<p>'+x+'</p>'}).join('');
if(p.ty=="txt")h+='<p class="au">Escrito por '+p.a+'</p>';
if(p.ty=="spots")h+='<p><a class="btn" href="'+SP+'" target="_blank" rel="noopener">🎧 Escuchar los spots</a></p><p class="sub">Se abre en Google Drive.</p>';
return h}
function go(n){i=Math.max(0,Math.min(D.length-1,n));speechSynthesis&&speechSynthesis.cancel();sp=false;draw();window.scrollTo(0,0)}
function draw(){var p=D[i];document.documentElement.style.setProperty("--c",p.c);var h='';
if(M=="A")h+='<nav class="pills">'+D.map(function(q,n){return'<button data-g="'+n+'" class="'+(n==i?'on':'')+'">'+q.k+'</button>'}).join('')+'</nav>';
h+='<div class="wrap">';
if(M=="B"&&i>0)h+='<p><button class="g" data-g="0">← Estante</button>'+(p.ty=="txt"?' <button class="g" id="say">🔊 Escuchar</button>':'')+'</p>';
h+='<article>'+body(p)+'</article><div class="foot"><button '+(i==0?'disabled ':'')+'data-g="'+(i-1)+'">◀ Anterior</button><span>'+(i+1)+' / '+D.length+'</span><button '+(i==D.length-1?'disabled ':'')+'data-g="'+(i+1)+'">Siguiente ▶</button></div><p class="sub" style="text-align:center;margin-top:24px">Escuela 4-182 Aida Font · Área de Lengua · 2.º 2.ª</p></div>';
$("#app").innerHTML=h;var s=$("#say");if(s)s.onclick=function(){if(!window.speechSynthesis){alert("Este dispositivo no admite lectura en voz alta");return}if(sp){speechSynthesis.cancel();sp=false;s.textContent="🔊 Escuchar";return}var u=new SpeechSynthesisUtterance($("article").innerText);u.lang="es-AR";u.onend=function(){sp=false;s.textContent="🔊 Escuchar"};sp=true;s.textContent="⏹ Detener";speechSynthesis.speak(u)}}
document.addEventListener("click",function(e){var t=e.target.closest("[data-g]");if(t)go(+t.dataset.g)});
document.addEventListener("keydown",function(e){if(e.key=="ArrowRight")go(i+1);if(e.key=="ArrowLeft")go(i-1)});
var x0=null;document.addEventListener("touchstart",function(e){x0=e.touches[0].clientX});document.addEventListener("touchend",function(e){if(x0===null)return;var d=e.changedTouches[0].clientX-x0;if(Math.abs(d)>70&&!e.target.closest(".pills"))go(d<0?i+1:i-1);x0=null});
draw();</script></body></html>
