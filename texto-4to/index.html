</style></head><body><div class="wrap" id="app"></div><script>
var D={"t": "Mejorar lo nuestro", "s": "En defensa del proyecto de mestizaje Boer-Criolla", "parts": [{"k": "Introducción", "p": ["En Desaguadero, donde el agua escasea y el pasto no sobra, cada recurso cuenta. En ese escenario, la producción caprina es uno de los principales emprendimientos pecuarios no solo de nuestro distrito, sino de todo el departamento de La Paz. Su actividad central es la cría de chivitos mamones, que se venden entre los dos y tres meses de vida para faena y consumo, cuando alcanzan aproximadamente siete kilogramos limpios. La raza que predomina en la zona es la Criolla.", "Frente a esta realidad, en nuestra escuela nos preguntamos: ¿qué factores inciden en la producción pecuaria paceña y qué soluciones sostenibles podemos proponer? Después de investigar, observar y trabajar de manera práctica con el ganado caprino escolar, sostenemos la siguiente tesis: el proyecto de mestizaje Boer-Criolla de nuestra escuela es una solución sostenible y eficaz para mejorar la producción caprina paceña, porque suma a la rusticidad de la cabra criolla la precocidad y el rendimiento en carne de la Boer, beneficia directamente a los productores de la zona y forma a los futuros técnicos."]}, {"k": "El proyecto en nuestra escuela", "p": ["La modalidad técnica de nuestra escuela es Pecuaria y, para aportar a las prácticas de alumnos y alumnas, contamos con ganado caprino. Con respecto a esta práctica de producción animal, se realiza desde el 2009 un proyecto de mejora genética. Aquel año comenzó cuando se adquirió un macho Boer, raza carnicera por excelencia, para cruzarlo con cabras criollas de la zona.", "El objetivo es agregar a las virtudes de la criolla (rusticidad y adaptación a nuestros campos y pasturas) lo que aporta la Boer: mayor cantidad y calidad de carne y menor tiempo de terminación. De este modo se obtienen chivitos de mayor peso y más precoces. Los machos mestizos se seleccionan y se entregan a productores paceños para que mejoren sus majadas, mientras que las hembras se faenan y se venden."]}, {"k": "Argumentos", "p": ["En primer lugar, el proyecto parte de lo que la zona ya tiene. La cabra criolla es la raza más explotada en el departamento y está adaptada al ambiente local: en el campo escolar, los animales se alimentan en buena parte de plantas nativas como el algarrobo, la zampa, el atamisque, el palo azul y el plumerito, y esa dieta se completa con un suplemento de maíz y alfalfa en el corral. Por lo tanto, el mestizaje no obliga a reemplazar el sistema productivo ni los animales conocidos: los toma como base y los mejora.", "En segundo lugar, el cruzamiento mejora el producto en aquello que más pesa en la actividad: el peso y el tiempo. Los chivitos mestizos alcanzan mayor peso que los de raza criolla pura y lo hacen en menos tiempo, porque son más precoces. Además, se trata de una carne muy valorada por los consumidores: tiene un contenido de grasa sensiblemente menor que el de la carne vacuna y aporta proteínas de alta calidad. Mejorar la genética significa, entonces, ofrecer un alimento más demandado con mejores resultados para quien lo produce.", "En tercer lugar, el beneficio no se queda dentro de la escuela. Los machos mestizos seleccionados se entregan a productores paceños para que puedan incorporar esa mejora genética con el fin de aumentar su productividad. Dado que la actividad caprina es tan importante en el departamento, mejorar la genética resulta fundamental para elevar los rendimientos, y este proyecto ofrece una vía concreta para lograrlo sin que los productores deban reemplazar todo su ganado.", "En cuarto lugar, el proyecto es sostenible porque se maneja con planificación y registro. La alimentación mixta aprovecha los recursos del campo antes de recurrir al suplemento; se seleccionan los reproductores; y al finalizar cada práctica se redactan informes que dejan constancia de las tareas realizadas, de las herramientas y equipos utilizados y de los conceptos aprendidos. Incluso se miden espacios con cintas métricas para calcular superficies y se miden con recipientes graduados los alimentos que se entregan como suplemento, aplicando porcentajes y regla de tres simple. Producir mejor, cuidando los recursos que permiten seguir produciendo mañana, es la esencia de la sostenibilidad.", "Por último, el proyecto es una escuela de formación. En la modalidad técnica, la producción animal no es solo teoría: es práctica que nos conecta con la realidad rural y que busca aplicar ciencia y tecnología para que la actividad sea eficiente, sostenible y rentable. Aquí aprendemos a elegir razas adaptadas al clima y al terreno de nuestra región, a seleccionar animales y a reconocer, a partir del boqueo, cuáles han finalizado su etapa productiva para retirarlos del rodeo y destinarlos a faena. Esa experiencia prepara a quienes, al egresar, trabajarán en campos o empresas del sector o montarán sus propios emprendimientos. Y gracias a la radio escolar y al podcast, lo que aprendemos llega también a las familias y a los productores de la zona."]}, {"k": "Conclusión", "p": ["Por todo lo expuesto, el proyecto de mestizaje Boer-Criolla merece ser defendido. Une la tradición de la cabra criolla con una mejora genética que da chivitos más pesados y más precoces; se comparte con los productores paceños; se maneja con planificación y registro; y forma a quienes serán los técnicos de mañana. Como estudiantes, no queremos solo describir los problemas de la producción de nuestra zona: queremos ser parte de la solución, y este proyecto es nuestra forma de demostrarlo."]}], "intro": ["En Lengua y Literatura trabajamos la argumentación: cómo sostener una postura con una tesis clara, apoyarla con argumentos y cerrarla con una conclusión. Ese es nuestro aporte al ABP de producción caprina.", "El texto que podés leer acá responde a la pregunta que organiza el proyecto del curso: ¿qué factores inciden en la producción pecuaria paceña y qué soluciones sostenibles proponemos? Y defiende una respuesta: el proyecto de mestizaje Boer-Criolla de nuestra escuela.", "Desde la materia lo acompañamos con un taller de oratoria, para llevar ese texto a la voz y a la radio escolar. Los datos del proyecto los presentan los talleres de la modalidad en sus propios espacios."], "logo": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAFAAWgDASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAAECAwQFBgcICQoL/8QAtRAAAgEDAwIEAwUFBAQAAAF9AQIDAAQRBRIhMUEGE1FhByJxFDKBkaEII0KxwRVS0fAkM2JyggkKFhcYGRolJicoKSo0NTY3ODk6Q0RFRkdISUpTVFVWV1hZWmNkZWZnaGlqc3R1dnd4eXqDhIWGh4iJipKTlJWWl5iZmqKjpKWmp6ipqrKztLW2t7i5usLDxMXGx8jJytLT1NXW19jZ2uHi4+Tl5ufo6erx8vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAAECAwQFBgcICQoL/8QAtREAAgECBAQDBAcFBAQAAQJ3AAECAxEEBSExBhJBUQdhcRMiMoEIFEKRobHBCSMzUvAVYnLRChYkNOEl8RcYGRomJygpKjU2Nzg5OkNERUZHSElKU1RVVldYWVpjZGVmZ2hpanN0dXZ3eHl6goOEhYaHiImKkpOUlZaXmJmaoqOkpaanqKmqsrO0tba3uLm6wsPExcbHyMnK0tPU1dbX2Nna4uPk5ebn6Onq8vP09fb3+Pn6/9oADAMBAAIRAxEAPwD7LooooAKKKKACiiigAooooAKKKKACiiigAooooAKKK8Z+OP7RPgb4ZiXTzN/bfiBQQNOtJB+7P/TV+ifTlvagD2V2CqWJAA6k9q8n+I37Q/ws8DvJbX/iGPUb+PINnpg+0SA+jEfIp+rCvhj4t/H74jfEaSW31DVm0zSWJ26bp7GKLHo5zuk/4EcewrynvQB9d+Nf22NYmeSHwf4OtLNOiz6lMZX+uxNoH5mvIPEf7SXxm1x28zxncWMZ/wCWdhCkAH4qN3615HXReF/A3jPxQyjw74W1nVAf47azd0/76AwPzoAbqvjfxlqrl9T8V65eMepmv5W/m1Yc1xPPzNPLIc5+dyf517Lov7Lnxq1NA58Kx2Knvd3sKH8gxP6V0MH7HPxckwZJ/DcXH8V85I/KOgD59tr++tiDbXtzCR08uVlx+Rro9F+JPxB0Vg2l+NfEFrt5ATUJNv5E4r1y6/Y8+L0Kloj4euMdAl+QT/30gFctrv7NXxp0gFpPBdxdoBktZXEU/wCitk/lQBo+GP2qPjLohVZtfttYiX/lnqFoj5/4Eu1v1r2XwL+2zYyFIPGng+a2yQGudMm8xR7+W+D+TGvkDxD4b8QeHpzBr2h6lpcoONt3avF+W4DNZVAH6ufDr4u/Dzx+iDwx4msrm5YZNnI3lXA/7Zvgn8Miu6r8bIJZIJkmhd45EIZXRiGUjuCOle+fB79qj4geDGhsNflPinR0wpju5MXMa/7E3U/Rs/hQB+i9FcD8Ifi54J+KGm/aPDOpg3UaBriwuMJcwfVO4/2lyK76gAooooAKKKKACiiigAooooAKKKKACiiigAooooAKKKKACiiigAooooAK
